<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Authorized — EveryGoodWork</title>
  <link rel="icon" href="__BASE__/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="__BASE__/css/tokens.css">
  <link rel="stylesheet" href="__BASE__/css/onboard.css">
  <style>.check{font-size:var(--step-4);color:var(--ob-accent-green);margin-block-end:var(--space-xs)}</style>
</head>
<body>
  <header class="site-header">
    <a href="__BASE__/dashboard" class="site-logo">CODEX</a>
  </header>
  <main style="max-width:50ch; margin-inline:auto; padding:var(--space-m) var(--space-xs-s)">
    <div class="ob-card active" style="margin-block-start:var(--space-s)">
      <div class="card-body" style="grid-template-rows:1fr">
        <div class="card-body-inner" style="padding-block:var(--space-s);text-align:center">
          <div class="check">&#10003;</div>
          <h2 style="font-size:var(--step-1);font-weight:600;margin-block-end:var(--space-2xs)">Authorized</h2>
          <p class="tos-desc">You can close this tab and return to the terminal.</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
